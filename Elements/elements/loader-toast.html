<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast stack</title><style>
  :root{--accent:#1c3f73;color-scheme:dark}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111412;color:#f2f3ed;font-family:Arial,sans-serif;position:relative}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.center{position:relative;text-align:center;display:flex;align-items:center;flex-direction:column;gap:20px}h1{font-size:clamp(28px,8vw,55px);letter-spacing:-.065em;line-height:1.05;margin:0;font-weight:600}h2{letter-spacing:-.04em}small{font-size:9px;letter-spacing:2px;color:#a4af9b}.hint{font-size:10px;color:#8b968b}.fire{padding:13px 21px;border:1px solid #4e6438;border-radius:9px;background:#212a1a;color:#d6e8bf;font-size:13px}.toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}.toast{display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:10px;background:#26331d;border:1px solid var(--accent);color:#e4f0d4;font-size:11px;animation:slidein .35s cubic-bezier(.22,1,.36,1)}.toast i{width:6px;height:6px;border-radius:50%;background:var(--accent)}@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.split span,.reveal-block{opacity:1!important;transform:none!important}}
  </style><body><div class="center"><button class="fire">Send a message</button><span class="hint">Click a few times</span></div><div class="toasts"></div><script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const wrap=document.querySelector(".toasts");let n=0;document.querySelector(".fire").onclick=()=>{const t=document.createElement("div");t.className="toast";t.innerHTML=`<i></i>Saved change ${++n}`;wrap.append(t);setTimeout(()=>{t.style.opacity=0;t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},2600)};}</script></body></html>
