<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light beams</title><style>
  :root{--accent:#1c3f73;color-scheme:dark}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111412;color:#f2f3ed;font-family:Arial,sans-serif;position:relative}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.center{position:relative;text-align:center;display:flex;align-items:center;flex-direction:column;gap:20px}h1{font-size:clamp(28px,8vw,55px);letter-spacing:-.065em;line-height:1.05;margin:0;font-weight:600}h2{letter-spacing:-.04em}small{font-size:9px;letter-spacing:2px;color:#a4af9b}.hint{font-size:10px;color:#8b968b}.beams{position:absolute;inset:0;overflow:hidden}.beams i{position:absolute;top:-60%;height:220%;width:90px;background:linear-gradient(var(--accent),transparent);opacity:.2;filter:blur(22px);transform:rotate(18deg);animation:sweep 9s ease-in-out infinite}.beams i:nth-child(2){left:38%;animation-delay:-3s;background:linear-gradient(#a78bfa,transparent)}.beams i:nth-child(3){left:70%;animation-delay:-6s}@keyframes sweep{0%,100%{transform:translateX(-140px) rotate(18deg)}50%{transform:translateX(140px) rotate(18deg)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.split span,.reveal-block{opacity:1!important;transform:none!important}}
  </style><body><div class="beams"><i></i><i></i><i></i></div><div class="center"><small>CATCH THE LIGHT</small><h1>Illuminate.</h1></div><script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){}</script></body></html>
