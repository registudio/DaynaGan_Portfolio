<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Border draw</title><style>
  :root{--accent:#1c3f73;color-scheme:dark}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111412;color:#f2f3ed;font-family:Arial,sans-serif;position:relative}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.center{position:relative;text-align:center;display:flex;align-items:center;flex-direction:column;gap:20px}h1{font-size:clamp(28px,8vw,55px);letter-spacing:-.065em;line-height:1.05;margin:0;font-weight:600}h2{letter-spacing:-.04em}small{font-size:9px;letter-spacing:2px;color:#a4af9b}.hint{font-size:10px;color:#8b968b}.draw{position:relative;width:260px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:#181d15;border-radius:14px}.draw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.draw rect{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:816;stroke-dashoffset:816;transition:stroke-dashoffset .8s ease}.draw:hover rect{stroke-dashoffset:0}.draw h2{font-size:22px;margin:0}.draw p{font-size:11px;color:#94a487;margin:0}
